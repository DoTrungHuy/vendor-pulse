name: Collect Agent Pulse data

on:
  push:
    branches: [main]
    paths:
      - "data/sources.json"
      - "scripts/collect.mjs"
  schedule:
    # Avoid the top-of-hour congestion window for scheduled Actions.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-pulse-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit verified data only when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh agent pulse"
          git push
